[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waas-antitrust"
version = "0.2.0"
description = "Modelo baseado em agentes para o mecanismo Whistleblower-as-a-Service em enforcement antitruste de mercados digitais."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "CC-BY-SA-4.0" }
authors = [{ name = "L." }]
keywords = ["antitrust", "agent-based-model", "cade", "whistleblower", "leniency", "mesa", "sobol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
    "mesa>=3.5,<4.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "SALib>=1.5",
    "joblib>=1.3",
    "pyarrow>=14.0",      # parquet
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mpl>=0.17",
    "pytest-xdist>=3.5",
    "nbval>=0.10",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.5",
    "jupyterlab>=4.0",
    "ipykernel>=6.25",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/freirelucas/waas-antitrust"
Repository = "https://github.com/freirelucas/waas-antitrust"
Issues = "https://github.com/freirelucas/waas-antitrust/issues"

[project.scripts]
waas-sobol = "waas_antitrust.cli:sobol"
waas-figuras = "waas_antitrust.cli:figuras"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"waas_antitrust" = ["calibracao/dados/*.csv"]

# ----- Ruff -----
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks/", "paper/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "N", "UP", "ANN", "SIM", "RET"]
ignore = [
    "E501",              # line-length é tratado por black
    "N802", "N803", "N806",  # nomes em maiúsculas (matemática) são bem-vindos
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B011"]
"scripts/**" = ["ANN"]

# ----- Black -----
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "notebooks/|paper/"

# ----- Pytest -----
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: testes lentos (varreduras paramétricas)",
    "integration: testes de integração (Mesa + Sobol)",
    "mpl_image_compare: regressão visual via pytest-mpl",
]
# pytest-mpl: aponta para baselines versionados; tolerância padrão 0,5.
# Os campos abaixo são lidos pelo plugin pytest-mpl quando a flag --mpl
# é passada na linha de comando; sem --mpl ficam dormentes.
mpl-baseline-path = "tests/baseline_images"
mpl-results-path = "tests/mpl_results"

# ----- Coverage -----
[tool.coverage.run]
branch = true
source = ["src/waas_antitrust"]
omit = ["*/cli.py", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
