name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Construir pacote
        run: python -m build

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Release ${{ github.ref_name }}

            Esta tag dispara automaticamente o arquivamento no Zenodo via integração GitHub-Zenodo (configurada manualmente).

            Veja CITATION.cff para metadados de citação.
          generate_release_notes: true
