site_name: waas-antitrust
site_description: >-
  Modelo baseado em agentes para o mecanismo Whistleblower-as-a-Service no
  enforcement antitruste de mercados digitais no Brasil.
site_author: "L."
repo_url: https://github.com/freirelucas/waas-antitrust
repo_name: freirelucas/waas-antitrust
edit_uri: edit/main/docs/
copyright: "Código e documentação sob CC BY-SA 4.0."

theme:
  name: material
  language: pt-BR
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/weather-night
        name: Mudar para o modo escuro
    - scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Mudar para o modo claro
  features:
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.integrate

nav:
  - Início: index.md
  - Como o mecanismo se sustenta: mecanismo.md
  - Resultados: resultados.md
  - Limitações: limitacoes.md
  - Como usar: uso.md
  - Glossário: glossario.md
  - Fundamentos:
      - Modelo (protocolo ODD): ODD.md
      - Análise institucional: INSTITUTIONAL.md
      - Referências: REFERENCES.md
  - Referência da API: api.md
  - Desenvolvimento:
      - Crítica x10: critica_x10.md
      - Plano de melhorias: plano_melhorias.md
      - Decisões e backlog: DECISIONS.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
