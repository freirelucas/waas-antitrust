site_name: waas-antitrust
site_description: >-
  Modelo baseado em agentes para o mecanismo Whistleblower-as-a-Service no
  enforcement antitruste de mercados digitais no Brasil.
site_author: "L."
repo_url: https://github.com/freirelucas/waas-antitrust
repo_name: freirelucas/waas-antitrust
edit_uri: edit/main/docs/
copyright: "Código e documentação sob CC BY-SA 4.0."

theme:
  name: material
  language: pt-BR
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/weather-night
        name: Mudar para o modo escuro
    - scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Mudar para o modo claro
  features:
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.integrate

nav:
  - "Ato 1 · O problema": index.md
  - "Ato 2 · O mecanismo": mecanismo.md
  - "Ato 3 · Resultados": resultados.md
  - "Ato 4 · Limitações": limitacoes.md
  - "Ato 5 · Colaborar": colaborar.md
  - Anexos:
      - Como usar: uso.md
      - "Brincar com o modelo (interativo)": brincar.md
      - Transparência epistêmica: transparencia.md
      - Kit de imprensa: imprensa.md
      - Formulário matemático: formulario.md
      - Teoria e modelo:
          - Bem coletivo e instrumentos: bem_publico.md
          - Modelagem multiagente: modelagem_multiagente.md
          - Modelo ABM (detalhe + parâmetros): modelo_abm.md
          - Modelo (protocolo ODD): ODD.md
      - Direito e instituições:
          - Análise institucional: INSTITUTIONAL.md
          - Procedimento administrativo (CADE): procedimento_cade.md
          - Compliance corporativo (especulativo): compliance_corporativo.md
          - Generalidade (EUA e UE): internacional.md
          - Viabilidade política do Regime C: viabilidade_regime_c.md
      - Referência:
          - Glossário: glossario.md
          - Terminologia canônica: TERMINOLOGIA.md
          - Referências: REFERENCES.md
          - Referência da API: api.md
  - Desenvolvimento:
      - Crítica x10: critica_x10.md
      - Crítica x10 v2: critica_x10_v2.md
      - Plano de melhorias: plano_melhorias.md
      - Roadmap de figuras: roadmap_figuras.md
      - Aprendizados (sessão reframe v2): aprendizados_v2.md
      - Aprendizados (correção radical v3): aprendizados_v3.md
      - Decisões e backlog: DECISIONS.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
