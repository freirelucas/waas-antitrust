site_name: LCMC · Leniência Condicionada à Massa Crítica
site_url: https://freirelucas.github.io/waas-antitrust/
site_description: >-
  LCMC — canal de depósito condicional (information escrow) operado pelo
  CADE, sem lei nova, para o antitruste de mercados digitais brasileiros.
  Cinco instrumentos de internalização opcionalmente acoplados ao canal,
  WaaS entre eles. Modelo baseado em agentes Mesa 3.x, 343 testes,
  21 figuras reproduzíveis, calibração formal R03 em (0,323; 0,481).
site_author: "L."
repo_url: https://github.com/freirelucas/waas-antitrust
repo_name: freirelucas/waas-antitrust
edit_uri: edit/main/docs/
copyright: >-
  Código e documentação sob CC BY-SA 4.0 ·
  <a href="https://github.com/freirelucas/waas-antitrust/blob/main/CITATION.cff">como citar</a> ·
  <a href="brincar/">brincar in-browser</a>

theme:
  name: material
  custom_dir: docs/overrides
  language: pt-BR
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/shield-key
    annotation: material/arrow-right-circle
    admonition:
      note: material/lightbulb-on-outline
      tip: material/check-circle-outline
      warning: material/alert-octagon-outline
      danger: material/skull-crossbones-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/weather-night
        name: Mudar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Mudar para o modo claro
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.indexes
    - navigation.prune
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/freirelucas/waas-antitrust
      name: Repositório no GitHub
    - icon: material/play-box-outline
      link: brincar/
      name: Brincar in-browser
  generator: false

nav:
  - "Ato 1 · O problema": index.md
  - "Ato 2 · O mecanismo": mecanismo.md
  - "Ato 3 · Resultados": resultados.md
  - "Ato 4 · Limitações": limitacoes.md
  - "Ato 5 · Colaborar": colaborar.md
  - Aprofundamento técnico:
      - Modelo ABM em detalhe: modelo_abm.md
      - Simulador in-browser: brincar.md
      - "Paper (rascunho v0.2.0)": paper.md
  - Sobre: sobre.md
  - Guias operacionais:
      - Como usar: uso.md
      - "Comandos e scripts (CLI)": comandos.md
      - Transparência epistêmica: transparencia.md
      - Kit de imprensa: imprensa.md
      - Formulário matemático: formulario.md
  - Teoria e modelo:
      - Bem coletivo e instrumentos: bem_publico.md
      - Modelagem multiagente: modelagem_multiagente.md
      - Catálogo de condutas digitais (28): condutas.md
      - Catálogos de choques institucionais (R19): choques.md
      - Modelo (protocolo ODD): ODD.md
  - Direito e instituições:
      - Análise institucional: INSTITUTIONAL.md
      - Procedimento administrativo (CADE): procedimento_cade.md
      - "Operacionalização (do modelo à Resolução)": operacional.md
      - Compliance corporativo (especulativo): compliance_corporativo.md
      - Generalidade (EUA e UE): internacional.md
      - Viabilidade política do Regime C: viabilidade_regime_c.md
      - "Módulo `normas/` (parser LexML BR)": normas.md
  - Referência:
      - Glossário: glossario.md
      - Terminologia canônica: TERMINOLOGIA.md
      - Referências: REFERENCES.md
      - Referência da API: api.md
  - Desenvolvimento:
      - Crítica x10: critica_x10.md
      - Crítica x10 v2: critica_x10_v2.md
      - Plano de melhorias: plano_melhorias.md
      - "Brainstorm de revisão (jun/2026)": brainstorm_revisao.md
      - "Revisão por personas (jun/2026)": revisao_personas.md
      - "Auditoria estrutural (jun/2026)": auditoria_estrutural.md
      - Roadmap de figuras: roadmap_figuras.md
      - Aprendizados (sessão reframe v2): aprendizados_v2.md
      - Aprendizados (correção radical v3): aprendizados_v3.md
      - Decisões e backlog: DECISIONS.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/simulador.js
